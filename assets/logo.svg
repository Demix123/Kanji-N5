<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Demix">
  <!-- Demix frog (カエル): deep tokiwa seal with a green frog peeking up -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1d4d35"/>
  <!-- eye bumps -->
  <circle cx="20" cy="25" r="10.5" fill="#6fae5c"/>
  <circle cx="44" cy="25" r="10.5" fill="#6fae5c"/>
  <!-- head -->
  <path d="M6 62 C6 40 18 31 32 31 C46 31 58 40 58 62 Z" fill="#6fae5c"/>
  <!-- belly / chin -->
  <path d="M16 62 C17 51 24 47 32 47 C40 47 47 51 48 62 Z" fill="#b7d68c"/>
  <!-- eyes -->
  <circle cx="20" cy="24.5" r="6.6" fill="#fcfaf3"/>
  <circle cx="44" cy="24.5" r="6.6" fill="#fcfaf3"/>
  <circle cx="21.4" cy="25.4" r="3.6" fill="#132a1e"/>
  <circle cx="42.6" cy="25.4" r="3.6" fill="#132a1e"/>
  <circle cx="22.6" cy="24" r="1.2" fill="#fcfaf3"/>
  <circle cx="43.8" cy="24" r="1.2" fill="#fcfaf3"/>
  <!-- nostrils, smile, cheeks -->
  <circle cx="29" cy="36" r="1" fill="#132a1e"/>
  <circle cx="35" cy="36" r="1" fill="#132a1e"/>
  <path d="M21 40 Q32 47 43 40" fill="none" stroke="#132a1e" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="15.5" cy="41" rx="3.6" ry="2.2" fill="#e08a6a" opacity=".7"/>
  <ellipse cx="48.5" cy="41" rx="3.6" ry="2.2" fill="#e08a6a" opacity=".7"/>
</svg>
